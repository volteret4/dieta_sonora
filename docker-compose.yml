# Instalación por separado. Dentro de REPEAT-ONE se usa el docker-compose.yml de REPEAT-ONE.
services:
  dieta-sonora:
    build: .
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: .env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - LIDARR_WATCH_TORRENTS_PATH=/mnt/lidarr_torrents/watch_torrents
      - LIDARR_TORRENTS_PATH=/mnt/lidarr_torrents
      - MOODE_TEMP_PATH=/mnt/moode_temp
      - ARTIST_SYNC_DB=/artistsync/artist_sync.db
      - TTS_WORK_DIR=/tmp/podcast-tts
    volumes:
      - .:/app
      - ${LIDARR_TORRENTS:-./datos/lidarr}:/mnt/lidarr_torrents
      - ${DESCARGAS:-./datos/descargas}:/mnt/moode_temp
      - ${ARTIST_SYNC_DIR:-./datos/artist_sync}:/artistsync:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PUERTO:-5010}:5001"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "dieta_sonora"
      ofelia.job-exec.dieta-sonora-daily.schedule: "0 0 1 * * *"
      ofelia.job-exec.dieta-sonora-daily.command: "nice -n 19 ionice -c 3 bash main.sh"

  dieta-sonora-stats:
    build: ./estadisticas/albums_log
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    env_file:
      - path: ./estadisticas/albums_log/.env
        required: false
    environment:
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
      - LASTFM_DB=/data/lastfm_stats.db
    volumes:
      - ./estadisticas/albums_log:/app
      - ${LASTFM_DIR:-./datos/lastfm}:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PUERTO_DIETA_SONORA_STATS:-8768}:8768"
    labels:
      ofelia.enabled: "true"
      repeat-one.ofelia: "dieta_sonora"
      ofelia.job-exec.dieta-sonora-stats-daily.schedule: "0 15 1 * * *"
      ofelia.job-exec.dieta-sonora-stats-daily.command: "nice -n 19 ionice -c 3 bash main.sh"
      ofelia.job-exec.dieta-sonora-stats-genres.schedule: "0 15 4 * * 0"
      ofelia.job-exec.dieta-sonora-stats-genres.command: "nice -n 19 ionice -c 3 python3 extraer_estadisticas.py"
      ofelia.job-exec.dieta-sonora-stats-scrobble-years.schedule: "0 45 1 * * *"
      ofelia.job-exec.dieta-sonora-stats-scrobble-years.command: "nice -n 19 ionice -c 3 python3 enrich_scrobble_years.py --limit 2000"

  # Ofelia lanza los trabajos programados de las etiquetas ofelia.job-exec.* de arriba
  # (los mismos horarios que en REPEAT-ONE). Solo ve los contenedores de este repo.
  # Si no quieres actualizaciones automáticas: docker compose stop ofelia
  ofelia:
    image: mcuadros/ofelia:latest
    restart: unless-stopped
    command: daemon --docker --docker-filter=label=repeat-one.ofelia=dieta_sonora
    environment:
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - dieta-sonora
      - dieta-sonora-stats
